<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PNG Maker App</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      text-align: center;
      padding: 2rem 1rem;
      margin: 0;
    }
    h1 { color: #38bdf8; margin-bottom: 0.25rem; font-size: 2.2rem; }
    p.subtitle { color: #94a3b8; margin-bottom: 1.5rem; font-size: 1rem; }
    
    .mode-selector {
      display: inline-flex;
      background: #1e293b;
      padding: 4px;
      border-radius: 8px;
      border: 1px solid #334155;
      margin-bottom: 1.5rem;
    }
    .mode-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 0.5rem 1.25rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }
    .mode-btn.active {
      background: #0284c7;
      color: white;
    }

    .dropzone {
      border: 2px dashed #38bdf8;
      background: #1e293b;
      padding: 3rem 1.5rem;
      border-radius: 12px;
      cursor: pointer;
      max-width: 500px;
      margin: 0 auto;
      transition: background 0.2s, border-color 0.2s;
    }
    .dropzone:hover { background: #334155; border-color: #7dd3fc; }
    .preview-grid {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-top: 2rem;
      flex-wrap: wrap;
    }
    .preview-card {
      background: #1e293b;
      padding: 1.25rem;
      border-radius: 12px;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 350px;
    }
    .img-box {
      width: 310px;
      height: 310px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
    }
    .checkerboard {
      background: repeating-conic-gradient(#475569 0% 25%, #1e293b 0% 50%) 50% / 20px 20px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #334155;
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    button.download {
      background: #0284c7;
      color: white;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 1rem;
      transition: background 0.2s;
      width: 100%;
    }
    button.download:hover { background: #0369a1; }
  </style>
</head>
<body>
  <h1>PNG Maker App</h1>
  <p class="subtitle">Extract subjects and create transparent PNGs locally</p>

  <div class="mode-selector">
    <button class="mode-btn active" id="modeGeneral" type="button">General / Photos (AI)</button>
    <button class="mode-btn" id="modeSignature" type="button">✍️ Signature / Document</button>
  </div>

  <div class="dropzone" id="dropzone">
    📁 Click or drag & drop an image here
  </div>
  <input type="file" id="fileInput" accept="image/*" style="display: none;" />

  <div class="preview-grid" id="previewArea" style="display: none;">
    <div class="preview-card">
      <h3>Original</h3>
      <div class="img-box">
        <img id="origImg" alt="Original Image" />
      </div>
    </div>
    <div class="preview-card">
      <h3>Cutout Result</h3>
      <div class="img-box checkerboard" id="resultContainer">
        <div class="spinner" id="loader"></div>
        <img id="resultImg" style="display: none;" alt="Transparent PNG" />
      </div>
      <a id="downloadLink" download="cutout.png" style="width: 100%; display: none;">
        <button class="download">Download PNG</button>
      </a>
    </div>
  </div>

  <script>
    let currentMode = "general";
    const modeGeneral = document.getElementById('modeGeneral');
    const modeSignature = document.getElementById('modeSignature');

    modeGeneral.onclick = () => {
      currentMode = "general";
      modeGeneral.classList.add("active");
      modeSignature.classList.remove("active");
    };

    modeSignature.onclick = () => {
      currentMode = "signature";
      modeSignature.classList.add("active");
      modeGeneral.classList.remove("active");
    };

    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const previewArea = document.getElementById('previewArea');
    const origImg = document.getElementById('origImg');
    const resultImg = document.getElementById('resultImg');
    const loader = document.getElementById('loader');
    const downloadLink = document.getElementById('downloadLink');

    dropzone.onclick = () => fileInput.click();

    fileInput.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      origImg.src = URL.createObjectURL(file);
      previewArea.style.display = 'flex';
      loader.style.display = 'block';
      resultImg.style.display = 'none';
      downloadLink.style.display = 'none';
      dropzone.innerText = "⏳ Processing image...";

      const formData = new FormData();
      formData.append("file", file);
      formData.append("mode", currentMode);

      try {
        const res = await fetch("/api/make-png", { method: "POST", body: formData });
        if (!res.ok) throw new Error("Processing failed");

        const blob = await res.blob();
        const url = URL.createObjectURL(blob);

        loader.style.display = 'none';
        resultImg.src = url;
        resultImg.style.display = 'block';
        downloadLink.href = url;
        downloadLink.style.display = 'block';
        dropzone.innerText = "✨ Done! Upload another image.";
      } catch (err) {
        loader.style.display = 'none';
        dropzone.innerText = "❌ An error occurred. Please try again.";
        console.error(err);
      }
    };
  </script>
</body>
</html>
